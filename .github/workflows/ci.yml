name: QE Continuous Integration Pipeline

on:
  pull_request:
    branches: [ main ] # Chốt chặn 1: Kích hoạt khi có Pull Request xin Merge
  push:
    branches: [ main ] # Chốt chặn 2: Kích hoạt khi Code đã được Merge vào Main

jobs:
  #══════════════════════════════════════════════
  # QUALITY GATE 1: SMOKE TEST (FAIL FAST ON PULL REQUEST)
  #══════════════════════════════════════════════
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Quality Gate 1 - Smoke Test
        run: npm run test:smoke

  #══════════════════════════════════════════════
  # QUALITY GATE 2: REGRESSION TEST (FULL SUITE ON MAIN)
  #══════════════════════════════════════════════
  regression-test:
    needs: smoke-test # Chỉ chạy Regression khi Smoke Test đã PASS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Quality Gate 2 - Automated Regression Test
        run: npm run test:regression
